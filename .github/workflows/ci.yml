name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-test.txt

      - name: Glyph templates must be present
        run: |
          python - <<'PY'
          import pathlib, sys
          # Glyph templates are named <family>_<codepoint>.png, e.g. B_24180.png
          # (年). DATE_LABEL.png has no numeric suffix and is not a glyph template.
          assets = sorted(pathlib.Path("assets").glob("*.png"))
          glyphs = [p for p in assets if "_" in p.stem and p.stem.split("_", 1)[1].isdigit()]
          families = {p.stem.split("_")[0] for p in glyphs}
          codepoints = {p.stem.split("_")[1] for p in glyphs}
          if families != {"B", "C", "D", "E", "F"} or codepoints != {"24180", "26085", "26376"}:
              sys.exit(f"glyph template set is incomplete: families={sorted(families)}, codepoints={sorted(codepoints)}")
          print(f"ok: {len(glyphs)} glyph templates, {len(families)} families x {len(codepoints)} characters")
          PY

      # The suite is weighted towards safety invariants: it asserts what the tool
      # must refuse to do, not only what it can do.
      - name: Run regression suite
        run: python -m pytest -q

      - name: Public release scan
        run: python tools/public_release_check.py
